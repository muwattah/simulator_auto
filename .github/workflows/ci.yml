name: CI

on:
  push:
    branches: [fase-5.2-rs-branding]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Static SEO and direct-route browser checks
        run: npm run test:seo

      - name: Browser UX checks and screenshots
        run: |
          npm run dev -- --host 127.0.0.1 --port 5278 > /tmp/rs-vite.log 2>&1 &
          curl --fail --silent --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5278/simulator_auto/ > /dev/null
          node scripts/browser-qa.mjs

      - name: Store UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detailing-studio-browser-qa
          path: .test-build/browser-qa
          if-no-files-found: ignore

