name = "rs-detailing-quote-mail"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://muwattah.github.io"
QUOTE_ADMIN_EMAIL = "info@survion.shop"

# Required Cloudflare Worker secrets, never committed:
# RESEND_API_KEY       - Resend API key for verified sender domain
# QUOTE_FROM_EMAIL    - verified sender mailbox address on your verified domain
# TURNSTILE_SECRET_KEY - secret paired with your public Turnstile widget
